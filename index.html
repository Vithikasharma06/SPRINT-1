let searchReq = 0, searchPrevFocus = null;
function openSearch(initial = '') {
  const ov = $('#searchOverlay');
  if (!ov.hidden) return;
  searchPrevFocus = document.activeElement;
  ov.hidden = false;
  document.body.classList.add('no-scroll');
  requestAnimationFrame(() => ov.classList.add('open'));
  const input = $('#searchInput');
  input.value = initial;
  setTimeout(() => input.focus(), 30);
  runSearch(initial);
}
function closeSearch(silent) {
  const ov = $('#searchOverlay');
  if (ov.hidden) return;
  ov.classList.remove('open');
  document.body.classList.remove('no-scroll');
  ov.hidden = true;
  if (!silent && searchPrevFocus && searchPrevFocus.focus) searchPrevFocus.focus();
}
function highlight(text, q) {
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean).map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!terms.length) return esc(text);
  const re = new RegExp(`(${terms.join('|')})`, 'ig');
  // split() with a capture group puts matches at odd indexes
  return String(text).split(re).map((part, i) => (i % 2 ? `<mark>${esc(part)}</mark>` : esc(part))).join('');
}
async function runSearch(raw) {
  const q = raw.trim();
  const box = $('#searchResults');

    return;

      <li class="search-item"><a href="#/story/${s.id}" style="animation-delay:${i * 25}ms">
        ${coverHTML(s, { size: 'xs', text: false })}
        <div><h3>${highlight(s.title, q)}</h3><p>${highlight(s.author, q)}. ${highlight(s.genre, q)}, ${s.moodEmoji} ${highlight(s.mood, q)}</p></div>

  } catch (err) {
    if (my === searchReq) paint(box, emptyState({ title: 'Search is unavailable right now.', text: err.message, compact: true, tag: 'h3' }));
  }

const ORNAMENT = `<svg class="ornament" viewBox="0 0 64 12" fill="none" aria-hidden="true"><path d="M0 6h22M42 6h22" stroke="currentColor" stroke-width="1"/><circle cx="32" cy="6" r="3" stroke="currentColor"/><circle cx="26" cy="6" r="1.2" fill="currentColor"/><circle cx="38" cy="6" r="1.2" fill="currentColor"/></svg>`;

async function renderReader({ params, query, token }) {
  const id = Number(params[0]);

        <button type="button" class="icon-btn show-sm" data-action="reader-themes" aria-label="Show reading modes">${ic('palette')}</button>
        <span class="sep" aria-hidden="true"></span>
        <button type="button" class="icon-btn" id="bookmarkBtn" data-action="bookmark" aria-label="Bookmark this position (B)">${ic('bookmark')}</button>
        <button type="button" class="icon-btn" data-action="toggle-drawer" aria-expanded="false" aria-controls="chapterDrawer" aria-label="Chapters">${ic('list')}</button>
      </div>
    </header>
    <article class="reader-page" id="readerPage"></article>

function renderChapter(ch, restorePct = 0, announceResume = false) {
  const r = state.reader; if (!r) return;
  const { story } = r;
  const n = story.chapters.length;
  r.ch = ch; r.pct = restorePct;
  const c = story.chapters[ch];
  const last = ch === n - 1;
  $('#readerChapterLabel').textContent = `Chapter ${ch + 1} of ${n}: ${c.title}`;
  paint($('#readerPage'), `
    <header class="reader-head">
      <p class="reader-story">${esc(story.title)}, by ${esc(story.author)}</p>
      <p class="chapter-num">Chapter ${ch + 1}</p>
      <h1 class="chapter-title">${esc(c.title)}</h1>
      ${ORNAMENT}
    </header>
    <div class="reader-text">${paragraphs(c.content)}</div>
    ${last ? `<section class="reader-finish">
        <p class="hand">the end</p>
        <h2>You’ve reached the last page.</h2>
        <p class="muted">Finish the story to add it to your shelf and your reading journey.</p>
        <div class="row" style="justify-content:center">
          ${ch > 0 ? `<button type="button" class="btn btn-ghost" data-action="prev-ch">${ic('chevron-left')}Previous chapter</button>` : ''}
          <button type="button" class="btn btn-primary btn-lg" data-action="finish">${ic('check')}Finish story</button>
        </div>
      </section>` : `<nav class="reader-nav" aria-label="Chapter navigation">
        ${ch > 0 ? `<button type="button" class="btn btn-ghost" data-action="prev-ch">${ic('chevron-left')}Previous</button>` : '<span></span>'}
        <div class="row"><div class="next-hint hide-sm"><small>Next</small><span style="font-family:var(--serif)">${esc(story.chapters[ch + 1].title)}</span></div>
        <button type="button" class="btn btn-primary" data-action="next-ch">Next chapter${ic('chevron-right')}</button></div>
      </nav>`}`);
  renderDrawer();
  window.scrollTo({ top: 0, behavior: 'instant' });
  const bar = $('#readerBar'); if (bar) bar.classList.remove('is-hidden');
  r.lastY = 0;
  if (restorePct > 0.01) {
    const restore = () => {
      if (state.reader !== r || r.ch !== ch) return;
      window.scrollTo({ top: restorePct * docMax(), behavior: 'instant' });
      r.pct = restorePct;
      updateReaderUI();
    };
    requestAnimationFrame(restore);
    // Web fonts change the page height; restore again once they're ready.
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(restore);
    if (announceResume) toast('Picked up where you left off ☕', 'info', 'bookmark-check');
  }
  updateReaderUI();
}
function renderDrawer() {
  const r = state.reader; if (!r) return;
  const bm = r.progress && r.progress.bookmark;
  paint($('#drawerBookmark'), bm ? `<div class="drawer-bookmark"><span>${ic('bookmark')}Bookmark: chapter ${bm.chapterIndex + 1}, ${Math.round(bm.scrollPct * 100)}% through</span><button type="button" class="btn btn-sm btn-ghost" data-action="jump-bookmark">Jump to bookmark</button></div>` : '');
  paint($('#drawerList'), r.story.chapters.map((c, i) => `<li><button type="button" data-action="goto-chapter" data-ch="${i}" ${i === r.ch ? 'aria-current="true"' : ''}><span class="n">${i + 1}</span><span>${esc(c.title)}</span></button></li>`).join(''));
  $('#bookmarkBtn').classList.toggle('is-on', !!bm && bm.chapterIndex === r.ch);
}
function updateReaderUI() {
  const r = state.reader; if (!r) return;
  const overall = clamp((r.ch + r.pct) / r.story.chapters.length, 0, 1);
  const bar = $('#readBar'); if (bar) bar.style.transform = `scaleX(${overall})`;
}
function onReaderScroll() {
  const r = state.reader;
  if (!r || r.raf) return;
  r.raf = true;
  requestAnimationFrame(() => {
    r.raf = false;
    if (state.reader !== r) return;
    const max = docMax();
    r.pct = max > 0 ? clamp(window.scrollY / max, 0, 1) : 1;
    updateReaderUI();
    // Toolbar hides while reading down, reappears on scroll up.
    const bar = $('#readerBar');
    const dy = window.scrollY - r.lastY;
    if (bar && Math.abs(dy) > 8) {
      bar.classList.toggle('is-hidden', dy > 0 && window.scrollY > 160 && r.pct < 0.97 && !$('#chapterDrawer.open'));
      r.lastY = window.scrollY;
    }
    if (bar && r.pct >= 0.97) bar.classList.remove('is-hidden');
    scheduleSave();
  });
}
async function saveProgress({ completed = false, bookmark, keepalive = false } = {}) {
  const r = state.reader; if (!r) return null;
  const body = { storyId: r.story.id, chapterIndex: r.ch, scrollPct: Number((r.pct || 0).toFixed(4)) };
  if (completed) body.completed = true;
  if (bookmark !== undefined) body.bookmark = bookmark;
  try {
    const res = await api('/progress', { method: 'POST', body, quiet: true, keepalive });
    if (state.reader === r) r.progress = res.progress;
    return res;
  } catch (err) {
    if (!r.warned) { r.warned = true; toast('Your reading position didn’t save. We’ll retry as you read.', 'error'); }
    return null;
  }
}
const scheduleSave = debounce(() => saveProgress(), 1200);
function leaveReader() {
  scheduleSave.cancel();
  window.removeEventListener('scroll', onReaderScroll);
  if (state.reader) saveProgress({ keepalive: true });
  state.reader = null;
}
function gotoChapter(ch) {
  const r = state.reader; if (!r) return;
  ch = clamp(ch, 0, r.story.chapters.length - 1);
  toggleDrawer(false);
  scheduleSave.cancel();
  renderChapter(ch, 0);
  saveProgress();
}
async function bookmarkHere() {
  const r = state.reader; if (!r) return;
  const btn = $('#bookmarkBtn');
  btn.classList.add('is-on'); btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
  const res = await saveProgress({ bookmark: true });

  else btn.classList.remove('is-on');
}
function jumpToBookmark() {
  const r = state.reader; const bm = r && r.progress && r.progress.bookmark;

function toggleDrawer(force) {

  else { const t = $('[data-action="toggle-drawer"][aria-expanded]'); if (t) t.focus({ preventScroll: true }); }
}
function changeFont(delta) {
  const r = state.reader;
  const keep = r ? r.pct : 0;
  state.fontSize = clamp(state.fontSize + delta, 15, 28);

async function finishStory() {
  const r = state.reader; if (!r) return;

/** The completion moment: a cup fills, steam draws, a few beans fall. */

  el.innerHTML = `<div class="brewed-card">${beans}

      <g class="steam" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"><path d="M44 36c-6-8 6-10 0-20"/><path d="M60 34c-6-8 6-10 0-20"/><path d="M76 36c-6-8 6-10 0-20"/></g>
      <g clip-path="url(#cupClip)"><rect class="fill" x="20" y="54" width="80" height="60" fill="#6b4a36"/></g>
      <path d="M26 48h68v24a34 34 0 0 1-34 34 34 34 0 0 1-34-34V48Z" stroke="var(--ink)" stroke-width="3"/>
      <path d="M94 56h6a11 11 0 0 1 0 22h-8" stroke="var(--ink)" stroke-width="3"/>
    </svg>
    <p class="hand">finished</p>
    <h2 id="brewedTitle">Another story brewed.</h2>
    <p>You finished <strong>${esc(story.title)}</strong>. That’s ${plural(count, 'story', 'stories')} on your shelf.</p>
    <div class="row" style="justify-content:center;margin-top:10px">
      <a class="btn btn-ghost" href="#/library?tab=completed">${ic('library')}My library</a>
      <a class="btn btn-primary" href="#/discover?mood=${encodeURIComponent(story.mood)}">${ic('sparkles')}Find the next one</a>
    </div>
  </div>`;
  document.body.appendChild(el);
  refreshIcons();
  const close = () => { el.remove(); document.removeEventListener('keydown', onKey, true); if (prev && prev.focus && document.body.contains(prev)) prev.focus(); };
  const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(); } else if (e.key === 'Tab') trapFocus(el, e); };

  el.addEventListener('click', (e) => { if (e.target === el) close(); });
  setTimeout(() => { const b = $('.btn-primary', el); if (b) b.focus(); }, 60);
}

const LIB_TABS = [

const LIB_EMPTY = {

let libTab = 'saved';

function renderLibrary({ query }) {

function readWriteForm() {

const updateWritePreviewDebounced = debounce(updateWritePreview, 200);
function validateStoryClient(d) {
  const e = {};
  if (d.title.trim().length < 2) e.title = 'Give your story a title (at least 2 characters).';
  if (!d.author.trim()) e.author = 'Add an author name.';
  if (d.description.trim().length < 10) e.description = 'Write a description of at least 10 characters.';
  if (d.cover.trim() && !/^https?:\/\/\S+$/i.test(d.cover.trim())) e.cover = 'Use an image link that starts with http:// or https://';
  if (!GENRES.includes(d.genre)) e.genre = 'Choose a genre.';
  if (!state.moods.some((m) => m.name === d.mood)) e.mood = 'Choose a mood.';
  if (!(d.readingTime >= 1 && d.readingTime <= 240)) e.readingTime = 'Between 1 and 240 minutes.';

function showFieldErrors(errors) {

    case 'save': e.preventDefault(); toggleSave(id); break;
    case 'like': e.preventDefault(); toggleLike(id); break;
    case 'read': e.preventDefault(); go(`#/read/${id}`); break;
    case 'open-search': openSearch(); break;
    case 'search-term': $('#searchInput').value = el.dataset.value; runSearch(el.dataset.value); $('#searchInput').focus(); break;
    case 'cycle-theme': cycleTheme(); break;
    case 'set-theme': setTheme(el.dataset.theme); break;
    case 'start-reading': startReading(); break;
    case 'rail': {
      const rail = document.getElementById(el.dataset.target);
      if (rail) rail.scrollBy({ left: Number(el.dataset.dir) * rail.clientWidth * 0.8, behavior: reducedMotion ? 'auto' : 'smooth' });
      break;
    }
    case 'filter': setFilter(el.dataset.key, el.dataset.value); break;
    case 'clear-filters': {
      Object.assign(state.discover, { q: '', genre: '', mood: '', length: '', minRating: '' });
      const q = $('#discoverQ'); if (q) q.value = '';
      loadDiscover();

    case 'lib-tab': libTab = el.dataset.tab; loadLibrary(); break;
    case 'lib-remove': libRemove(id, el); break;
    case 'exit-reader': go(state.reader ? `#/story/${state.reader.story.id}` : '#/'); break;
    case 'font': changeFont(Number(el.dataset.delta)); break;
    case 'prev-ch': if (state.reader) gotoChapter(state.reader.ch - 1); break;
    case 'next-ch': if (state.reader) gotoChapter(state.reader.ch + 1); break;
    case 'goto-chapter': gotoChapter(Number(el.dataset.ch)); break;
    case 'toggle-drawer': toggleDrawer(); break;
    case 'bookmark': bookmarkHere(); break;
    case 'jump-bookmark': jumpToBookmark(); break;

      $('#wCover').value = `https://picsum.photos/seed/storybrew-${Math.random().toString(36).slice(2, 9)}/600/900`;

// Clicking the dimmed area around the search panel closes it.
$('#searchOverlay').addEventListener('mousedown', (e) => { if (e.target.id === 'searchOverlay') closeSearch(); });

document.addEventListener('keydown', (e) => {
  const tag = document.activeElement ? document.activeElement.tagName : '';
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(tag);
  const ov = $('#searchOverlay');
  if (!ov.hidden) {
    if (e.key === 'Escape') { e.preventDefault(); closeSearch(); return; }
    if (e.key === 'Tab') { trapFocus($('.search-panel'), e); return; }
    if (e.key === 'ArrowDown' && document.activeElement.id === 'searchInput') {
      const first = $('#searchResults a, #searchResults button'); if (first) { e.preventDefault(); first.focus(); }
    }
    return;
  }
  if ($('.modal-backdrop') || $('.brewed')) return;
  if ((e.key === 'k' && (e.metaKey || e.ctrlKey)) || (e.key === '/' && !typing)) { e.preventDefault(); openSearch(); return; }

  // Library tabs: arrow keys move between tabs (WAI-ARIA tabs pattern).
  if (document.activeElement.classList.contains('tab') && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    const tabs = $$('.tab');
    const i = tabs.indexOf(document.activeElement);
    const next = tabs[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
    next.focus(); libTab = next.dataset.tab; loadLibrary();
    return;
  }

  // Reader shortcuts
  if (state.reader && !typing && !e.metaKey && !e.ctrlKey && !e.altKey) {
    const r = state.reader;
    if (e.key === 'Escape') {
      if ($('#chapterDrawer.open')) toggleDrawer(false);
      else go(`#/story/${r.story.id}`);
    } else if (e.key === 'ArrowRight' && r.ch < r.story.chapters.length - 1) gotoChapter(r.ch + 1);
    else if (e.key === 'ArrowLeft' && r.ch > 0) gotoChapter(r.ch - 1);
    else if (e.key === 'b' || e.key === 'B') bookmarkHere();
  }
});

  if (state.reader && e.clientY < 72) { const bar = $('#readerBar'); if (bar) bar.classList.remove('is-hidden'); }
}, { passive: true });
// Keyboard users: focusing any toolbar control reveals the toolbar.
document.addEventListener('focusin', (e) => {
  if (state.reader && e.target.closest && e.target.closest('#readerBar')) $('#readerBar').classList.remove('is-hidden');
});

// Sticky header gains its blurred background once the page scrolls.
const topbar = $('#topbar');
window.addEventListener('scroll', () => { topbar.classList.toggle('scrolled', window.scrollY > 8); }, { passive: true });

// Save the reading position if the tab is hidden or closed mid-chapter.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && state.reader) { scheduleSave.cancel(); saveProgress({ keepalive: true }); }
});

/* =========================================================================
   INIT
   ========================================================================= */
function renderOffline() {
  paint(app, `<div class="wrap page">${emptyState({
    title: 'Story Brew can’t reach its server.',
    text: 'Start it with “npm start” in the project folder, then open http://localhost:3000 in your browser.',
    action: `<button type="button" class="btn btn-primary" onclick="location.reload()">${ic('rotate-ccw')}Try again</button>`,
  })}</div>`);
}
async function init() {
  setTheme(state.theme);
  try {
    // /me runs first so the session cookie exists before any parallel requests.
    const me = await api('/me', { quiet: true });
    state.me = me.user;
    state.avatars = me.avatars;
    state.saved = new Set(me.savedIds);
    state.liked = new Set(me.likedIds);
    state.moods = (await api('/moods', { quiet: true })).moods;
  } catch (err) {
    renderOffline();
    return;
  }
  updateNavAvatar();
  window.addEventListener('hashchange', router);
  router();
}
init();
})();
</script>
</body>
